name: Bug report
description: Report a bug in a Lyse Registry component or the doc site
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before submitting, please search [existing issues](https://github.com/lyse-labs/lyse-registry/issues) to avoid duplicates.

  - type: input
    id: component
    attributes:
      label: Component
      description: Which component is affected? Leave blank if it's a doc-site issue unrelated to a specific component.
      placeholder: "Accordion, Sheet, Slider..."

  - type: dropdown
    id: surface
    attributes:
      label: Which surface is affected?
      options:
        - Component behavior/rendering
        - Component installed via shadcn CLI (public/r/*.json)
        - Doc site (ui.getlyse.com)
        - Documentation content
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Steps to reproduce. Include the exact install command if relevant.
      placeholder: |
        1. npx shadcn@latest add https://ui.getlyse.com/r/accordion.json
        2. Render <Accordion> with ...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: "Chrome 128 / macOS 15"

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/lyse-labs/lyse-registry/blob/main/CODE_OF_CONDUCT.md)
          required: true
